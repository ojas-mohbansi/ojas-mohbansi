<!--
  The issue as a film. Six frames — one per selected project — with a projector
  running through them: each frame comes up to full ink for a sixth of a
  twelve-second cycle, and the underline beneath it comes up with it.
  Static fallback is complete: every frame is legible with the motion off.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320"
     role="img" aria-label="A filmstrip of six frames, one per selected project, advancing under a projector">
  <title>The issue as six frames</title>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .tag{font-size:15px;letter-spacing:5px;fill:#6b6557}
    .num{font-size:14px;letter-spacing:2px;fill:#6b6557}
    .ink{stroke:#15140f;stroke-width:1.3;fill:none}
    .rule{stroke:#cdc5b3;stroke-width:1;fill:none}
    /* the projector */
    .f{animation:frame 12s linear infinite}
    .f1{animation-delay:0s}.f2{animation-delay:2s}.f3{animation-delay:4s}
    .f4{animation-delay:6s}.f5{animation-delay:8s}.f6{animation-delay:10s}
    @keyframes frame{0%,100%{opacity:.3}6%,16%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.f{animation:none;opacity:1}}
  </style>

  <defs>
    <pattern id="perf" width="52" height="18" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="9" rx="2" fill="#15140f" opacity=".75"/>
      <rect x="26" y="0" width="16" height="9" rx="2" fill="#15140f" opacity=".75"/>
    </pattern>
  </defs>

  <rect width="1100" height="320" fill="#f1ece1"/>
  <rect x="0" y="14" width="1100" height="18" fill="url(#perf)"/>
  <rect x="0" y="286" width="1100" height="18" fill="url(#perf)"/>

  <text class="tag" x="25" y="300" fill="#6b6557">THE ISSUE AS SIX FRAMES</text>
  <text class="num" x="1075" y="300" text-anchor="end">12s LOOP</text>

  <!-- 01 Proto: the loop -->
  <g class="f f1">
    <rect class="rule" x="25" y="54" width="150" height="196"/>
    <line class="ink" x1="55" y1="100" x2="145" y2="100"/>
    <line class="ink" x1="55" y1="130" x2="145" y2="130"/>
    <line class="ink" x1="55" y1="160" x2="145" y2="160"/>
    <circle cx="55" cy="100" r="3.5" fill="#a3311b"/>
    <text class="num" x="33" y="272">01</text>
    <rect x="25" y="252" width="150" height="3" fill="#a3311b"/>
  </g>

  <!-- 02 Nyaya Sahayak: four panes -->
  <g class="f f2">
    <rect class="rule" x="205" y="54" width="150" height="196"/>
    <rect class="rule" x="227" y="92" width="48" height="34"/>
    <rect class="rule" x="285" y="92" width="48" height="34"/>
    <rect class="rule" x="227" y="136" width="48" height="34"/>
    <rect class="rule" x="285" y="136" width="48" height="34"/>
    <line class="ink" x1="227" y1="196" x2="333" y2="196"/>
    <text class="num" x="213" y="272">02</text>
    <rect x="205" y="252" width="150" height="3" fill="#a3311b"/>
  </g>

  <!-- 03 Chimera OS: the tree -->
  <g class="f f3">
    <rect class="rule" x="385" y="54" width="150" height="196"/>
    <line class="ink" x1="417" y1="92" x2="417" y2="182"/>
    <line class="ink" x1="417" y1="106" x2="497" y2="106"/>
    <line class="ink" x1="417" y1="136" x2="497" y2="136"/>
    <line class="ink" x1="417" y1="166" x2="497" y2="166"/>
    <text class="num" x="393" y="272">03</text>
    <rect x="385" y="252" width="150" height="3" fill="#a3311b"/>
  </g>

  <!-- 04 NagarVault: the building and the wall -->
  <g class="f f4">
    <rect class="rule" x="565" y="54" width="150" height="196"/>
    <rect class="ink" x="587" y="92" width="86" height="76"/>
    <line class="ink" x1="695" y1="80" x2="695" y2="196" stroke-dasharray="7 6" stroke="#a3311b"/>
    <text class="num" x="573" y="272">04</text>
    <rect x="565" y="252" width="150" height="3" fill="#a3311b"/>
  </g>

  <!-- 05 Winget: the layer stack -->
  <g class="f f5">
    <rect class="rule" x="745" y="54" width="150" height="196"/>
    <rect x="777" y="96" width="86" height="9" fill="#15140f" opacity=".45"/>
    <rect x="777" y="118" width="86" height="9" fill="#15140f" opacity=".6"/>
    <rect x="777" y="140" width="86" height="9" fill="#15140f" opacity=".78"/>
    <rect x="777" y="162" width="86" height="9" fill="#15140f"/>
    <line class="ink" x1="777" y1="196" x2="863" y2="196"/>
    <text class="num" x="753" y="272">05</text>
    <rect x="745" y="252" width="150" height="3" fill="#a3311b"/>
  </g>

  <!-- 06 VulnScanPro: the two-line premise and a scan -->
  <g class="f f6">
    <rect class="rule" x="925" y="54" width="150" height="196"/>
    <line class="ink" x1="955" y1="122" x2="1045" y2="122"/>
    <line class="ink" x1="955" y1="146" x2="1045" y2="146"/>
    <line class="ink" x1="955" y1="180" x2="1045" y2="96" stroke="#a3311b"/>
    <text class="num" x="933" y="272">06</text>
    <rect x="925" y="252" width="150" height="3" fill="#a3311b"/>
  </g>
</svg>

