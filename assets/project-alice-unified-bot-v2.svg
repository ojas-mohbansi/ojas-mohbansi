<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">Alice Unified Bot: Dual-platform WhatsApp and Discord bot running Baileys and Discord.js v14 concurrently.</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B120B"/><stop offset="1" stop-color="#070C07"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#1A6B2A" stop-opacity=".7"/><stop offset="1" stop-color="#113A11" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#5CA668" stroke-opacity=".07"/>
    </pattern>
    <filter id="p2-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F5F0"/><stop offset=".45" stop-color="#8DD68D"/><stop offset="1" stop-color="#5CA668" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p2-in { animation: p2-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p2-d1 { animation-delay: .15s; } .p2-d2 { animation-delay: .4s; }
    .p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p2-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p2-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-in, .p2-chip { animation: none; } .p2-draw { animation: none; stroke-dashoffset: 0; } }
    .p2-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p2-trace 7s linear infinite; }
    @keyframes p2-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-trace { display: none; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>
    <g class="p2-in p2-d1">
      <text class="p2-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#5CA668">02 · BOT AUTOMATION · DUAL PLATFORM · 2024</text>
      <text class="p2-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F0F5F0">Alice Unified Bot</text>
      <text class="p2-sans" x="56" y="166" font-size="17" fill="#A3B0A3">WhatsApp + Discord running concurrently — same commands, same SQLite persistence, two platforms.</text>
      <text class="p2-mono" x="56" y="200" font-size="12.5" fill="#8DD68D"><tspan fill="#5CA668">BUILT ›</tspan> Baileys + Discord.js v14 in one Node.js process · modular command router · slash commands</text>
      <line class="p2-draw" x1="56" y1="226" x2="680" y2="226" stroke="#5CA668" stroke-opacity=".3"/>
    <g transform="translate(56 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#F0F5F0">Dual</text><text class="p2-sans" y="24" font-size="12.5" fill="#A3B0A3">WhatsApp + Discord</text></g>
    <g transform="translate(261 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#F0F5F0">SQLite</text><text class="p2-sans" y="24" font-size="12.5" fill="#A3B0A3">persistent session cache</text></g>
    <g transform="translate(466 266)"><text class="p2-serif" font-size="34" font-weight="300" fill="#F0F5F0">Modular</text><text class="p2-sans" y="24" font-size="12.5" fill="#A3B0A3">command router</text></g>
      <g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#10180D" stroke="#5CA668" stroke-opacity=".35"/><text class="p2-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#8DD68D">Node.js</text></g>
      <g class="p2-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="65" height="26" rx="13" fill="#10180D" stroke="#5CA668" stroke-opacity=".35"/><text class="p2-mono" x="167" y="331" text-anchor="middle" font-size="11.5" fill="#8DD68D">Baileys</text></g>
      <g class="p2-chip" style="animation-delay:1.24s"><rect x="207" y="314" width="110" height="26" rx="13" fill="#10180D" stroke="#5CA668" stroke-opacity=".35"/><text class="p2-mono" x="262" y="331" text-anchor="middle" font-size="11.5" fill="#8DD68D">Discord.js v14</text></g>
      <g class="p2-chip" style="animation-delay:1.36s"><rect x="325" y="314" width="60" height="26" rx="13" fill="#10180D" stroke="#5CA668" stroke-opacity=".35"/><text class="p2-mono" x="355" y="331" text-anchor="middle" font-size="11.5" fill="#8DD68D">SQLite</text></g>
    </g>
    <g class="p2-in p2-d2"><g transform="translate(0 35)">
      <g transform="translate(760 40)" class="p2-mono" font-size="13" text-anchor="middle">
        <text x="12" y="20" text-anchor="start" font-size="10.5" letter-spacing="2.4" fill="#A3B0A3">BAILEYS · DISCORD.JS V14 · SQLITE</text>
        <path d="M12 120 H70" stroke="#5CA668" stroke-opacity=".5"/>
        <path class="p2-draw" d="M190 120 C 240 120, 250 64, 300 64" fill="none" stroke="#8DD68D" stroke-width="1.5"/>
        <path d="M190 120 C 240 120, 250 176, 300 176" fill="none" stroke="#5CA668" stroke-opacity=".45" stroke-dasharray="4 6"/>
        <rect x="70" y="98" width="120" height="44" rx="22" fill="#10180D" stroke="#5CA668" stroke-opacity=".5"/>
        <text x="130" y="125" fill="#F0F5F0">message</text>
        <rect x="300" y="42" width="116" height="44" rx="22" fill="#113A11" stroke="#8DD68D"/>
        <text x="358" y="69" fill="#F0F5F0">WhatsApp</text>
        <rect x="300" y="154" width="116" height="44" rx="22" fill="#0B120B" stroke="#5CA668" stroke-opacity=".4"/>
        <text x="358" y="181" fill="#A3B0A3">Discord</text>
        <circle r="4.5" fill="#F0F5F0" filter="url(#p2-glowf)">
          <animateMotion dur="3.6s" repeatCount="indefinite" path="M12 120 H130 C 220 120, 250 64, 358 64" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"/>
        </circle>
        <text x="12" y="236" text-anchor="start" font-size="10.5" letter-spacing="1.5" fill="#A3B0A3">unified handler · same command suite</text>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#5CA668" stroke-opacity=".2"/>
    <rect class="p2-trace" style="animation-delay:-1.7s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
