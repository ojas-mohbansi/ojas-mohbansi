name: generate snake animation

# Runs once a day, on demand (Actions tab -> this workflow -> Run workflow),
# and every time main is pushed.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution snake (svg + gif)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=#F5C451&color_dots=#0D1117,#30363D,#806020,#C99A3E,#F5C451

      - name: Push output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Fix permission issues caused by files being created under root ownership
          if [ -d dist ]; then
            sudo chown -R "$(id -u):$(id -g)" dist || true
            sudo chmod -R u+rwX dist || true
            rm -rf dist/.git || true
          fi

          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b output
          git add -A
          git commit -qm "chore: update contribution snake" || echo "No changes to commit"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" output
