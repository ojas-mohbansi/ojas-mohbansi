name: generate snake animation

# Runs once a day, on demand (Actions tab -> this workflow -> Run workflow),
# and every time main is pushed.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake (svg + gif)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=#F5C451&color_dots=#0D1117,#30363D,#806020,#C99A3E,#F5C451

      # Pushes straight to the "output" branch with plain git - no third-party
      # deploy action in the loop. If this step fails, the error in the log
      # will be a normal git/auth error instead of an opaque action failure.
      - name: Push output branch
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b output
          git add -A
          git commit -q -m "chore: update contribution snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
